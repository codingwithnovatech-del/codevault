<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="monetag" content="72d07695612df7358f3ca13025a32a2c" />
    <meta name="description" content="CodeVault — Your developer workspace for templates, components, and code snippets" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>CodeVault</title>
    <script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
    <script type="text/javascript">
    aclib.runVideoSlider({
        zoneId: '11410642',
    });
</script>
    <script>
    window.addEventListener('error', function(e) {
      var d = document.getElementById('error-display');
      if(d) { d.textContent = 'Error: ' + (e.message || e.error || 'unknown') + ' at ' + (e.filename||'') + ':' + (e.lineno||''); d.style.display = 'block'; }
    });
    window.addEventListener('unhandledrejection', function(e) {
      var d = document.getElementById('error-display');
      if(d) { d.textContent = 'Unhandled Promise: ' + (e.reason||''); d.style.display = 'block'; }
    });
    navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) {
            r.unregister();
        }
    });
    caches.keys().then(function(keys) {
        for (var k of keys) { caches.delete(k); }
    });
    </script>
    <style>
    #ad-sidebar { position: fixed; left: 24px; bottom: 100px; width: 250px; height: 250px; z-index: 30; display: none; }
    #ad-footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 39; display: none; justify-content: center; background: transparent; padding: 2px; }
    @media (min-width: 768px) { #ad-sidebar { display: block; } }
    @media (max-width: 767px) { #ad-footer { display: flex; } }
    </style>
  </head>
  <body class="bg-background text-on-surface">
    <div id="root"></div>
    <div id="error-display" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#dc2626;color:#fff;padding:12px 16px;font-size:13px;font-family:monospace;white-space:pre-wrap;word-break:break-all;"></div>

    <div id="ad-sidebar"></div>
    <div id="ad-footer"></div>

    <script type="text/javascript">
    aclib.runInPagePush({zoneId:'11410646', maxAds:2});
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
